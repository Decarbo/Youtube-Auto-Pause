<!DOCTYPE html>
<html>
<head>
    <title>Generate Icons</title>
</head>
<body>
    <h3>Right-click each icon and "Save image as..." with the correct name:</h3>
    <div style="margin: 20px;">
        <h4>icon16.png (16x16):</h4>
        <canvas id="icon16" width="16" height="16"></canvas>
    </div>
    <div style="margin: 20px;">
        <h4>icon48.png (48x48):</h4>
        <canvas id="icon48" width="48" height="48"></canvas>
    </div>
    <div style="margin: 20px;">
        <h4>icon128.png (128x128):</h4>
        <canvas id="icon128" width="128" height="128"></canvas>
    </div>
    <script>
        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const center = size / 2;
            const radius = size * 0.47;

            // Draw background circle
            ctx.fillStyle = '#2196F3';
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw pause symbol
            ctx.fillStyle = 'white';
            const barWidth = size * 0.15;
            const barHeight = size * 0.45;
            const barPadding = size * 0.15;

            // Left bar
            ctx.fillRect(
                center - barWidth - barPadding/2,
                center - barHeight/2,
                barWidth,
                barHeight
            );

            // Right bar
            ctx.fillRect(
                center + barPadding/2,
                center - barHeight/2,
                barWidth,
                barHeight
            );
        }

        // Draw all three icons
        drawIcon('icon16', 16);
        drawIcon('icon48', 48);
        drawIcon('icon128', 128);
    </script>
</body>
</html>
